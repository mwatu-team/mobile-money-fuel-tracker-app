name: Android Gateway Checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test assembleDebug

  # Builds the signed Play Store bundle. Runs only for pushes to main and v* tags, never for
  # pull requests, so forks cannot reach the signing secrets.
  release:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MMFT_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret MMFT_UPLOAD_KEYSTORE_BASE64 is not set; add the upload-keystore secrets (see README, Releasing to Google Play)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "MMFT_UPLOAD_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build release bundle
        env:
          MMFT_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.MMFT_UPLOAD_KEYSTORE_PASSWORD }}
          MMFT_UPLOAD_KEY_ALIAS: ${{ secrets.MMFT_UPLOAD_KEY_ALIAS }}
          MMFT_UPLOAD_KEY_PASSWORD: ${{ secrets.MMFT_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
